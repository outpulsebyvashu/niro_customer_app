<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Niro admin</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f7f7f5;--ink:#0b0b0b;--mut:#62625f;--card:#fff;--line:#dcdcd9}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0c;--ink:#f3f3f1;--mut:#a3a3a0;--card:#1a1a1a;--line:#333}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}h1{font-size:26px;margin:6px 0 14px}h2{font-size:18px;margin:26px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
button.s{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5}
.err{color:#c0392b;font-size:14px;margin:8px 0}.ok{color:#2f9e5a;font-size:14px;margin:8px 0}small{color:var(--mut)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin-left:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts button{padding:8px 12px;font-size:14px}
</style></head><body><main>
<h1>Niro admin</h1>
<div id="login" class="card" hidden>
  <p>Sign in with an admin mobile number. Only numbers listed in <b>ADMIN_PHONES</b> can open this page.</p>
  <label for="ph">Mobile number</label><input id="ph" type="tel" inputmode="numeric" maxlength="10" placeholder="9876543210">
  <div id="otpbox" hidden><label for="otp">6-digit code</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
  <p class="err" id="lerr" hidden></p><div class="acts"><button id="lgo">Send code</button></div>
</div>
<div id="app" hidden>
  <div class="acts" style="justify-content:space-between;margin:0"><small id="who"></small><button class="s" id="out">Log out</button></div>
  <h2>Add a cafe</h2>
  <form id="add" class="card">
    <label for="n">Name</label><input id="n" required maxlength="80">
    <div class="row"><div><label for="k">Type</label><select id="k"><option value="cafe">Cafe</option><option value="restaurant">Restaurant</option></select></div><div><label for="g">Stamps for reward</label><input id="g" type="number" min="1" max="20" value="8"></div></div>
    <div class="row"><div><label for="a">Area</label><input id="a" maxlength="60" placeholder="e.g. Saraswathipuram"></div><div><label for="c">City</label><input id="c" maxlength="60" value="Mysuru"></div></div>
    <div class="row"><div><label for="la">Latitude</label><input id="la" inputmode="decimal"></div><div><label for="lo">Longitude</label><input id="lo" inputmode="decimal"></div></div>
    <div class="acts"><button type="button" class="s" id="here">Use my current location</button></div>
    <small>Stand at the cafe and tap the button for exact coordinates.</small>
    <div class="row"><div><label for="op">Opens</label><input id="op" type="time" value="08:00"></div><div><label for="cl">Closes</label><input id="cl" type="time" value="22:00"></div></div>
    <label for="r">Reward</label><input id="r" maxlength="60" value="Free filter coffee">
    <label for="of">First offer (optional)</label><input id="of" maxlength="100" placeholder="e.g. Free cookie with any coffee">
    <div class="row"><div><label for="b1">Background</label><input id="b1" type="color" value="#3b2418"></div><div><label for="b2">Text</label><input id="b2" type="color" value="#f5e6d3"></div><div><label for="b3">Accent</label><input id="b3" type="color" value="#d9a066"></div></div>
    <label for="pt">Card pattern</label><select id="pt"><option>dots</option><option>stripes</option><option>rings</option><option>grid</option></select>
    <p class="err" id="aerr" hidden></p><p class="ok" id="aok" hidden></p>
    <div class="acts"><button type="submit">Add cafe</button></div>
  </form>
  <h2>Cafes</h2><div id="list"></div>
</div>
</main>
<script>
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(m,p,b){var o={method:m,headers:{},credentials:'same-origin'};if(b!==undefined||m!=='GET'){o.headers['content-type']='application/json';if(b!==undefined)o.body=JSON.stringify(b)}
  return fetch(p,o).then(function(r){return r.text().then(function(t){var d=null;try{d=t?JSON.parse(t):null}catch(e){}if(!r.ok){var e=new Error((d&&d.error)||'Something went wrong.');e.status=r.status;throw e}return d})})}
var otpSent=false;
$('#lgo').onclick=function(){
  var er=$('#lerr');er.hidden=true;var ph=$('#ph').value.replace(/\D/g,'');
  if(!otpSent){api('POST','/api/auth/request-otp',{phone:ph,name:'Admin'}).then(function(){otpSent=true;$('#otpbox').hidden=false;$('#lgo').textContent='Verify';$('#otp').focus()}).catch(function(e){er.textContent=e.message;er.hidden=false})}
  else api('POST','/api/auth/verify',{phone:ph,code:$('#otp').value}).then(function(){boot()}).catch(function(e){er.textContent=e.message;er.hidden=false});
};
$('#out').onclick=function(){api('POST','/api/auth/logout').then(function(){location.reload()})};
$('#here').onclick=function(){navigator.geolocation.getCurrentPosition(function(p){$('#la').value=p.coords.latitude.toFixed(6);$('#lo').value=p.coords.longitude.toFixed(6)},function(){alert('Could not get location. Allow location for this site.')},{enableHighAccuracy:true,timeout:15000})};
function boot(){
  api('GET','/api/admin/cafes').then(function(d){$('#login').hidden=true;$('#app').hidden=false;render(d.cafes)}).catch(function(e){$('#app').hidden=true;$('#login').hidden=false;if(e.status===403){$('#lerr').textContent='This number is not an admin.';$('#lerr').hidden=false}});
}
function render(cs){
  $('#who').textContent=cs.length+' cafe'+(cs.length===1?'':'s');
  $('#list').innerHTML=cs.length?cs.map(function(c){return '<div class="card" data-id="'+esc(c.id)+'"><b>'+esc(c.name)+'</b><span class="pill">'+(c.is_active?'Live':'Hidden')+'</span><br><small>'+esc(c.kind)+' · '+esc(c.area||'')+' '+esc(c.city)+' · '+c.members+' members · '+c.lat.toFixed(4)+', '+c.lng.toFixed(4)+'</small>'+
    '<div class="acts"><button class="s" data-a="tog">'+(c.is_active?'Hide from app':'Show in app')+'</button><button class="s" data-a="offer">Add offer</button><button class="s" data-a="staff">Add staff</button></div></div>'}).join(''):'<p><small>No cafes yet. Add the first one above.</small></p>';
}
$('#list').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;var id=b.closest('.card').dataset.id,a=b.dataset.a,p;
  if(a==='tog'){api('GET','/api/admin/cafes').then(function(d){var c=d.cafes.filter(function(x){return x.id===id})[0];return api('PATCH','/api/admin/cafes/'+id,{is_active:!c.is_active})}).then(boot).catch(function(x){alert(x.message)})}
  else if(a==='offer'){var t=prompt('Offer text');if(t)api('POST','/api/admin/cafes/'+id+'/offers',{title:t}).then(function(){alert('Offer added')}).catch(function(x){alert(x.message)})}
  else if(a==='staff'){var ph=prompt('Staff mobile number (10 digits)');if(ph)api('POST','/api/admin/cafes/'+id+'/staff',{phone:ph.replace(/\D/g,'')}).then(function(){alert('Staff added')}).catch(function(x){alert(x.message)})}
};
$('#add').onsubmit=function(e){
  e.preventDefault();var er=$('#aerr'),ok=$('#aok');er.hidden=ok.hidden=true;
  var body={name:$('#n').value.trim(),kind:$('#k').value,stamp_goal:+$('#g').value||8,area:$('#a').value.trim()||undefined,city:$('#c').value.trim(),lat:+$('#la').value,lng:+$('#lo').value,opens:$('#op').value,closes:$('#cl').value,reward_text:$('#r').value.trim(),offer_title:$('#of').value.trim()||undefined,brand:{bg:$('#b1').value,ink:$('#b2').value,acc:$('#b3').value,pattern:$('#pt').value}};
  if(!$('#la').value||!$('#lo').value){er.textContent='Add the location. Tap "Use my current location".';er.hidden=false;return}
  api('POST','/api/admin/cafes',body).then(function(){ok.textContent='Cafe added. It is live in the app now.';ok.hidden=false;$('#n').value='';$('#of').value='';boot()}).catch(function(x){er.textContent=x.message;er.hidden=false});
};
boot();
</script></body></html>
